name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AgySize.sln
      - name: Build
        run: dotnet build AgySize.sln --no-restore -c Release
      - name: Test
        run: dotnet test tests/AgySize.Core.Tests/AgySize.Core.Tests.csproj --no-restore -c Release

  publish-windows:
    name: Publish Windows executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish AgySize.App (exécutable autonome, mode ".exe")
        run: dotnet publish src/AgySize.App/AgySize.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64
      - name: Publish AgySize.Cli (pour les scans planifiés)
        run: dotnet publish src/AgySize.Cli/AgySize.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64
      - name: Sign binaries (si le certificat AGYTEK est configuré)
        if: ${{ secrets.CODE_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: ./scripts/Sign-Binaries.ps1 -Path "publish/win-x64/AgySize.App.exe","publish/win-x64/AgySize.Cli.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGY-Size-win-x64
          path: publish/win-x64

  build-installer:
    name: Build MSI installer (expérimental)
    runs-on: windows-latest
    needs: publish-windows
    # Best-effort : ce job ne bloque pas le reste de la CI si WiX échoue. Voir installer/README.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish app for installer (dossier non compressé)
        run: dotnet publish src/AgySize.App/AgySize.App.csproj -c Release -r win-x64 --self-contained true -o installer/publish
      - name: Sign app binary (si le certificat AGYTEK est configuré)
        if: ${{ secrets.CODE_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: ./scripts/Sign-Binaries.ps1 -Path "installer/publish/AgySize.App.exe"
      - name: Install WiX toolset
        run: dotnet tool install --global wix --version 4.0.5
      - name: Add WiX UI extension
        run: wix extension add WixToolset.UI.wixext/4.0.5
      - name: Build MSI
        run: dotnet build AgySize.Installer.wixproj -c Release -p:PublishDir=publish
        working-directory: installer
      - name: Sign MSI (si le certificat AGYTEK est configuré)
        if: ${{ secrets.CODE_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          $msi = Get-ChildItem -Path installer/bin -Filter *.msi -Recurse | Select-Object -First 1
          ./scripts/Sign-Binaries.ps1 -Path $msi.FullName
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: AGY-Size-installer
          # Platform=x64 (voir AgySize.Installer.wixproj) place la sortie dans bin/x64/Release/ ;
          # le glob couvre aussi bin/Release/ au cas où la structure de sortie changerait.
          path: installer/bin/**/*.msi
