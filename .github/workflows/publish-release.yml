name: Publish release binaries to repo

# Déclenchement manuel uniquement (onglet Actions -> "Run workflow") : on ne veut pas qu'un commit
# binaire de ~100 Mo soit ajouté au dépôt à chaque push pendant le développement. À lancer quand une
# version stable doit être rendue disponible directement depuis le projet (dossier releases/).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    name: Build and commit release binaries
    runs-on: windows-latest
    env:
      CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
      CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
      # Numéro de version des binaires publiés : 1.1.<numéro de ce run> (voir Directory.Build.props).
      AGY_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish AgySize.App (exécutable autonome)
        run: dotnet publish src/AgySize.App/AgySize.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64 -p:AgyBuildNumber=${{ env.AGY_BUILD_NUMBER }}

      - name: Publish AgySize.Cli (pour les scans planifiés)
        run: dotnet publish src/AgySize.Cli/AgySize.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64 -p:AgyBuildNumber=${{ env.AGY_BUILD_NUMBER }}

      - name: Publish app for installer (dossier non compressé)
        run: dotnet publish src/AgySize.App/AgySize.App.csproj -c Release -r win-x64 --self-contained true -o installer/publish -p:AgyBuildNumber=${{ env.AGY_BUILD_NUMBER }}

      - name: Sign binaries (si le certificat AGYTEK est configuré)
        # Une condition if: ne peut pas référencer le contexte "secrets" directement (limitation
        # GitHub Actions) : on passe par la variable d'environnement définie au niveau du job.
        if: ${{ env.CODE_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          ./scripts/Sign-Binaries.ps1 -Path `
            "publish/win-x64/AgySize.App.exe", `
            "publish/win-x64/AgySize.Cli.exe", `
            "installer/publish/AgySize.App.exe"

      - name: Install WiX toolset
        run: dotnet tool install --global wix --version 4.0.5

      - name: Add WiX UI extension
        run: wix extension add WixToolset.UI.wixext/4.0.5

      - name: Build MSI
        run: dotnet build AgySize.Installer.wixproj -c Release -p:PublishDir=publish -p:AgyBuildNumber=${{ env.AGY_BUILD_NUMBER }}
        working-directory: installer

      - name: Sign MSI (si le certificat AGYTEK est configuré)
        if: ${{ env.CODE_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path installer/bin -Filter *.msi -Recurse | Select-Object -First 1
          ./scripts/Sign-Binaries.ps1 -Path $msi.FullName

      - name: Assemble releases folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Compress-Archive -Path publish/win-x64/* -DestinationPath releases/AGY-Size-portable-win-x64.zip -Force
          $msi = Get-ChildItem -Path installer/bin -Filter *.msi -Recurse | Select-Object -First 1
          Copy-Item $msi.FullName -Destination releases/AGY-Size-Setup.msi -Force
          $version = "1.1.${{ env.AGY_BUILD_NUMBER }}"
          $commit = "${{ github.sha }}".Substring(0, 7)
          Set-Content -Path releases/version.txt -Encoding utf8 -Value @(
            "AGY-Size $version ($commit)",
            "Publié le $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC"
          )

      - name: Commit and push release binaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/AGY-Size-Setup.msi releases/AGY-Size-portable-win-x64.zip releases/version.txt
          if git diff --cached --quiet; then
            echo "Aucun changement binaire à commiter."
          else
            git commit -m "chore: release AGY-Size 1.1.${{ env.AGY_BUILD_NUMBER }} (built from ${{ github.sha }}) [skip ci]"
            git push
          fi
